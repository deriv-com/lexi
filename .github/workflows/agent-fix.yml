      - name: Run the coding agent (segment 5)
        if: env.AGENT_CONTINUE == 'true'
        env:
          MODEL: ${{ inputs.model }}
          MODEL_BASE_URL: ${{ inputs.model_base_url }}
          MODEL_API_KEY: ${{ secrets.model_api_key }}
          MAX_TURNS: ${{ inputs.max_turns }}
          SKILL: ${{ inputs.skill }}
