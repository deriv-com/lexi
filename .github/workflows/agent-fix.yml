          /usr/bin/tar -xzf "${RUNNER_TEMP}/lexi-trusted.tgz" -C "$T"
          exec /bin/bash "$T/scripts/run-agent-segment.sh" 7 7

      - name: Finalize result contract
        if: always()
        run: |
          set -euo pipefail
          ANNOUNCEMENT=false
          HANDBACK=false
          [ -s /tmp/announcement.txt ] && ANNOUNCEMENT=true
          [ -s /tmp/handback.txt ] && HANDBACK=true

          # When nothing replaced the seed hand-back, name the step that failed
          # so the requester is told which check stopped the run. Best-effort:
          # this step must never fail, because it is what publishes a result.
          if [ -f /tmp/handback.seed ] && cmp -s /tmp/handback.seed /tmp/handback.txt; then
