        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-fix-${{ github.run_id }}
          path: |
            /tmp/investigation.txt
            /tmp/announcement.txt
            /tmp/handback.txt
            /tmp/run.jsonl
          if-no-files-found: error

      # Visual evidence for the reviewer: runs when a PR exists, whether the
      # agent shipped or handed back with a PR open. Never allowed to affect the
      # result: continue-on-error and its own timeout.
      - name: Capture visual evidence
        id: evidence
        if: always() && inputs.evidence_command != ''
        continue-on-error: true
        timeout-minutes: ${{ inputs.evidence_timeout_minutes }}
        env:
          EVIDENCE_COMMAND: ${{ inputs.evidence_command }}
          LEXI_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          T=$(/usr/bin/mktemp -d)
          echo "${LEXI_TRUSTED_SHA}  ${RUNNER_TEMP}/lexi-trusted.tgz" | /usr/bin/sha256sum -c --quiet -
          /usr/bin/tar -xzf "${RUNNER_TEMP}/lexi-trusted.tgz" -C "$T"
          if [ -s /tmp/announcement.txt ] || grep -qE 'https://github.com/[^[:space:]]+/pull/[0-9]+' /tmp/handback.txt 2>/dev/null; then
            PR=true
          else
            echo "No PR to show; nothing to capture."
            echo "pr=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The command runs the repository's code: it is stopped, and its file
          # commands dropped, before the upload steps after it start.
          source "$T/scripts/agent-sandbox.sh"
          MARK=$(sandbox_mark)
          export EVIDENCE_DIR="${GITHUB_WORKSPACE}/.lexi-agent-evidence"
          mkdir -p "$EVIDENCE_DIR"
          echo .lexi-agent-evidence >> .git/info/exclude
          bash -euo pipefail -c "$EVIDENCE_COMMAND" || echo "::warning::evidence capture did not complete; continuing"
          sandbox_stop "$MARK" || echo "::warning::some processes the evidence command started could not be stopped"
          sandbox_reset_file_commands
          echo "pr=${PR}" >> "$GITHUB_OUTPUT"
          echo "::group::evidence captured"
          ls -la "$EVIDENCE_DIR" || true
          echo "::endgroup::"

      # Screenshots cannot be edited: a file there that holds a credential, in
      # any form or shape, is deleted rather than uploaded.
      - name: Redact the visual evidence
        id: redact-evidence
        if: always() && steps.evidence.outputs.pr == 'true'
        continue-on-error: true
        env:
          MODEL_API_KEY: ${{ secrets.model_api_key }}
          LEXI_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          T=$(/usr/bin/mktemp -d)
          echo "${LEXI_TRUSTED_SHA}  ${RUNNER_TEMP}/lexi-trusted.tgz" | /usr/bin/sha256sum -c --quiet -
          /usr/bin/tar -xzf "${RUNNER_TEMP}/lexi-trusted.tgz" -C "$T"
          node "$T/scripts/redact-output.mjs" --files "${GITHUB_WORKSPACE}/.lexi-agent-evidence"

      - name: Upload visual evidence
        if: always() && steps.evidence.outputs.pr == 'true' && steps.redact-evidence.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agent-fix-visuals-${{ github.run_id }}
          path: ${{ github.workspace }}/.lexi-agent-evidence/
          if-no-files-found: ignore
