          # the seed hand-back, which is still an honest result.
          if [ -f .lexi-agent/agent-fix/scripts/check-output-contract.sh ]; then
            bash .lexi-agent/agent-fix/scripts/check-output-contract.sh /tmp/announcement.txt /tmp/handback.txt
          else
            echo "check-output-contract.sh unavailable; relying on the seed hand-back."
          fi

