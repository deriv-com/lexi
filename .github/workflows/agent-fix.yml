            # the files hold only what the workflow itself wrote.
            echo "No agent ran; nothing to redact."
            exit 0
          fi
          T=$(/usr/bin/mktemp -d)
          echo "${LEXI_TRUSTED_SHA}  ${RUNNER_TEMP}/lexi-trusted.tgz" | /usr/bin/sha256sum -c --quiet -
          /usr/bin/tar -xzf "${RUNNER_TEMP}/lexi-trusted.tgz" -C "$T"
          GH_TOKEN=""
          if [ -f /tmp/gh-token ] && [ ! -L /tmp/gh-token ]; then GH_TOKEN=$(tr -d '\r\n' < /tmp/gh-token); fi
          export GH_TOKEN
          node "$T/scripts/redact-output.mjs" --files \
            /tmp/investigation.txt /tmp/announcement.txt /tmp/handback.txt /tmp/run.jsonl

      # Every earlier token was revoked when the next one was minted; this one
      # is revoked rather than left live for up to an hour.
      - name: Revoke the GitHub token
        if: always()
        run: |
          set -euo pipefail
          if [ -s /tmp/gh-token ]; then
