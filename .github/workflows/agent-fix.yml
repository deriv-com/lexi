            git config core.hooksPath "$PRIOR"
            echo "Restored core.hooksPath to ${PRIOR}"
          else
            git config --local --unset-all core.hooksPath 2>/dev/null || true
            echo "Cleared core.hooksPath (there was no local setting before this job)."
          fi

