      # ::add-mask:: hides a secret from the log, not from a file. They are
      # redacted in place before upload: by value for what the agent held (the
      # model key and the current token, read here before it is revoked), by
      # shape for every other GitHub token and private key. If the redaction
      # fails, the upload below does not run.
      - name: Redact the agent's output
        id: redact
        if: always()
        continue-on-error: true
        env:
          MODEL_API_KEY: ${{ secrets.model_api_key }}
          LEXI_TRUSTED_SHA: ${{ steps.trusted.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -z "${LEXI_TRUSTED_SHA:-}" ]; then
