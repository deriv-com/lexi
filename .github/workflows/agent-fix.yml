            echo "result=shipped" >> "$GITHUB_OUTPUT"
          elif [ -s /tmp/handback.txt ] && [ ! -s /tmp/announcement.txt ]; then
            { echo "### Handed back: needs a human"; cat /tmp/handback.txt; } >> "$GITHUB_STEP_SUMMARY"
            echo "===== AGENT_FIX_RESULT: HANDBACK ====="
            cat /tmp/handback.txt
