# Copy into your rebuild repository as .github/workflows/programme-build.yml.
#
# A thin caller: the work happens in the reusable workflow in this project
# (github.com/deriv-com/lexi). The orchestrator dispatches it once per build
# task with workflow_dispatch; see docs/programme-contract.md for the brief,
# result and evidence shapes, and for the rulesets to create before the first
# dispatch.
#
# Pin `uses:` to a release tag or commit SHA rather than @main once one exists,
# and set `lexi_ref` to the same ref so the composite actions match the workflow.

name: programme-build

on:
  workflow_dispatch:
    inputs:
      attempt_id:
        description: Attempt id, echoed on every evidence bundle.
        required: true
        type: string
      build_task_id:
        description: Build task id.
        required: true
        type: string
      brief_url:
        description: URL of the BuildTaskBrief on the orchestrator. Must be <LEXI_ORCHESTRATOR_URL>/api/programme/briefs/<attempt_id>.
        required: true
        type: string
      workdir:
        description: App directory, for a repository that holds more than one app.
        required: false
        type: string
        default: ""
      base_branch:
        description: Working branch for a working-branch programme. Empty means the default branch.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    uses: deriv-com/lexi/.github/workflows/programme-build.yml@main
    with:
      attempt_id: ${{ inputs.attempt_id }}
      build_task_id: ${{ inputs.build_task_id }}
      brief_url: ${{ inputs.brief_url }}
      workdir: ${{ inputs.workdir }}
      base_branch: ${{ inputs.base_branch }}
      enabled: ${{ vars.PROGRAMME_BUILD_ENABLED == 'true' }}
      orchestrator_url: ${{ vars.LEXI_ORCHESTRATOR_URL }}
      model_base_url: ${{ vars.LEXI_MODEL_BASE_URL }}
      # Everything below is optional. Uncomment what your repository needs.
      # runner: ubuntu-latest
      # default_model: claude-sonnet-5-5
      # branch_prefix: lexi/
      # green_timeout_minutes: 150
      # Exact Claude Code version every agent phase installs (pinned by default).
      # claude_code_version: "2.1.319"
      lexi_ref: main
    secrets:
      app_id: ${{ secrets.LEXI_APP_ID }}
      app_private_key: ${{ secrets.LEXI_APP_PRIVATE_KEY }}
      model_api_key: ${{ secrets.LEXI_MODEL_API_KEY }}
      brief_token: ${{ secrets.LEXI_BRIEF_TOKEN }}
      evidence_token: ${{ secrets.LEXI_EVIDENCE_TOKEN }}
      # Only when the orchestrator sits behind an identity-aware proxy.
      # access_client_id: ${{ secrets.LEXI_ACCESS_CLIENT_ID }}
      # access_client_secret: ${{ secrets.LEXI_ACCESS_CLIENT_SECRET }}
