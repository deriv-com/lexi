# People directory overrides for the fictional "Acme" organisation.
#
# GitHub logins and Slack IDs share no field, so the agent links them only
# through an explicit entry here (or a Slack profile that already carries a
# GitHub login). It never guesses. `managerGithub` drives the MANAGER rung of
# the escalation ladder.

people:
  - githubLogin: alice
    slackId: U0TEST01
    displayName: Alice
    managerGithub: grace
    teams: [web]
